name: Sync dijkstra.cddl

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync from cardano-ledger@${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        branch:
          - leios-prototype
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Fetch upstream dijkstra.cddl
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          base="https://raw.githubusercontent.com/IntersectMBO/cardano-ledger"
          path="eras/dijkstra/impl/cddl/data/dijkstra.cddl"
          if ! curl -fsSL "$base/$BRANCH/$path" -o src/ledger/dijkstra.cddl; then
            echo "No matching upstream branch '$BRANCH', falling back to 'master'"
            curl -fsSL "$base/master/$path" -o src/ledger/dijkstra.cddl
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ matrix.branch }}
          branch: sync/dijkstra-cddl-${{ matrix.branch }}
          delete-branch: true
          commit-message: "Sync dijkstra.cddl from cardano-ledger@${{ matrix.branch }}"
          title: "Sync dijkstra.cddl from cardano-ledger@${{ matrix.branch }}"
          body: |
            Automated update of `src/ledger/dijkstra.cddl` from
            [`IntersectMBO/cardano-ledger@${{ matrix.branch }}`](https://github.com/IntersectMBO/cardano-ledger/blob/${{ matrix.branch }}/eras/dijkstra/impl/cddl/data/dijkstra.cddl).
